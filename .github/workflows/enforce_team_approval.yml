name: Fetch Team Members on PR Submission
on:
  pull_request:
    branches:
      - develop  # Trigger for PRs targeting the 'develop' branch
    types: [opened]  # Trigger only when the PR is opened
permissions:
  contents: read
  pull-requests: read
jobs:
  fetch_team_members:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Define and use Team Names in one step
      run: |
        Team_Members=("teamahdfc" "teambsidgs")
        Team_A="${Team_Members[0]}"
        Team_B="${Team_Members[1]}"
        echo "Team A: $Team_A"
        echo "Team B: $Team_B"
        echo "TEAM_A=$Team_A" >> $GITHUB_ENV
        echo "TEAM_B=$Team_B" >> $GITHUB_ENV
    - name: Fetch Team B Members
        run: |
          echo "Fetching Team B Members"
          TEAM_B="your-team-id"  # Make sure this is set to the correct Team ID
          TEAM_B_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.MY_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$TEAM_B/members")
          sudo apt-get install jq
          # Optional: Parsing the JSON response to extract specific details, like the login names of the members
          echo "Response for Team B Members:"
          echo "$TEAM_B_MEMBERS" | jq '.[] | {id, slug}'  # This will extract the login names of the team members
          
         # If you just want to output the whole response, uncomment the next line:
           echo "$TEAM_B_MEMBERS"
