name: Fetch Team Members on PR Submission

on:
  pull_request:
    branches:
      - develop  # Trigger for PRs targeting the 'develop' branch
    types: [opened]  # Trigger only when the PR is opened

jobs:
  fetch_team_members:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Define and use Team Names in one step
      run: |
        Team_Members=("teamahdfc" "teambsidgs")
        Team_A="${Team_Members[0]}"
        Team_B="${Team_Members[1]}"
        echo "Team A: $Team_A"
        echo "Team B: $Team_B"

    - name: Fetch Team A Members
      run: |
        echo "Fetching Team A Members"
        response_a=$(curl -s -H "Authorization: Bearer ${{ secrets.MY_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_A/members")
        echo "Team A Members: $response_a"

    - name: Fetch Team B Members
      run: |
        echo "Fetching Team B Members"
        response_b=$(curl -s -H "Authorization: Bearer ${{ secrets.MY_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_B/members")
        echo "Team B Members: $response_b"
