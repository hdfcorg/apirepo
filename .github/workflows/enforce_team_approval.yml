name: Fetch Team Members on PR Submission

on:
  pull_request:
    branches:
      - develop  # Only trigger for PRs targeting the develop branch
    types: [opened]  # Trigger only when a PR is opened

jobs:
  fetch_team_members:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Define and use Team Names in one step
      run: |
        Team_Members=("teamahdfc" "teambsidgs")
        Team_A="${Team_Members[0]}"
        Team_B="${Team_Members[1]}"
        echo "Team A: $Team_A"
        echo "Team B: $Team_B"

    - name: Fetch Team A Members
      run: |
        echo "Fetching Team A Members"
        response=$(curl -s -H "Authorization: Bearer ${MY_TOKEN}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_A/members")
        
        # Check if the curl command was successful
        if [ $? -ne 0 ]; then
          echo "Error fetching members for Team A"
          exit 1
        fi

        # Log the full response to see its structure
        echo "Response: $response"  # This will help us inspect what is returned

        # Check if the response contains an error message (e.g., "Not Found")
        if echo "$response" | jq -e '.message' > /dev/null; then
          echo "Error: $response"  # Log the error response from GitHub API
          exit 1
        fi

        # If the response is valid, proceed with extracting member logins
        echo "$response" | jq '.[].login'  # Extract the login field for each member

    - name: Fetch Team B Members
      run: |
        echo "Fetching Team B Members"
        response=$(curl -s -H "Authorization: Bearer ${MY_TOKEN}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_B/members")

        # Check if the curl command was successful
        if [ $? -ne 0 ]; then
          echo "Error fetching members for Team B"
          exit 1
        fi

        # Log the full response to see its structure
        echo "Response: $response"  # This will help us inspect what is returned

        # Check if the response contains an error message (e.g., "Not Found")
        if echo "$response" | jq -e '.message' > /dev/null; then
          echo "Error: $response"  # Log the error response from GitHub API
          exit 1
        fi

        # If the response is valid, proceed with extracting member logins
        echo "$response" | jq '.[].login'  # Extract the login field for each member
