name: Fetch Team Members on PR Submission

on:
  pull_request:
    branches:
      - develop  # Trigger for PRs targeting the 'develop' branch
    types: [opened]  # Trigger only when the PR is opened

permissions:
  contents: read
  # CORRECT PERMISSIONS FOR TEAM ACCESS
  pull-requests: read
  # members: read  # Required for organization member data    

jobs:
  fetch_team_members:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Define and use Team Names in one step
      run: |
        Team_Members=("teamahdfc" "teambsidgs")
        Team_A="${Team_Members[0]}"
        Team_B="${Team_Members[1]}"
        echo "Team A: $Team_A"
        echo "Team B: $Team_B"

    - name: Fetch Team A Members
      run: |
        echo "Fetching Team A Members"
        Team_A=$(curl -s -H "Authorization: Bearer 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" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_A/members")
        echo "Response for Team A Members: $Team_A"
        echo "$Team_A_MEMBERS" | jq '.[] | {login, id}'

    - name: Fetch Team B Members
      run: |
        echo "Fetching Team B Members"
        Team_B_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$Team_B/members")
        echo "Response for Team B Members: $Team_B_MEMBERS"
