name: Fetch Team Members on PR Submission
on:
  pull_request:
    branches:
      - develop  # Trigger for PRs targeting the 'develop' branch
    types: [opened]  # Trigger only when the PR is opened
permissions:
  contents: read
  pull-requests: read
jobs:
  fetch_team_members:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Define and use Team Names in one step
      run: |
        Team_Members=("teamahdfc" "teambsidgs")
        Team_A="${Team_Members[0]}"
        Team_B="${Team_Members[1]}"
        echo "Team A: $Team_A"
        echo "Team B: $Team_B"
        echo "TEAM_A=$Team_A" >> $GITHUB_ENV
        echo "TEAM_B=$Team_B" >> $GITHUB_ENV
    - name: Fetch Team A Members
      run: |
        echo "Fetching Team A Members"
        TEAM_A_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$TEAM_A/members")
        echo "Response for Team A Members:"
        echo "$TEAM_A_MEMBERS"
        
    - name: Fetch Team B Members
      run: |
        echo "Fetching Team B Members"
        TEAM_B_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/orgs/hdfcorg/teams/$TEAM_B/members")
        echo "Response for Team B Members:"
        echo "$TEAM_B_MEMBERS" | jq '.[] | {login, id}'
