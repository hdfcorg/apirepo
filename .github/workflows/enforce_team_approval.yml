name: Enforce Team-Based Approvals

on:
  pull_request:
    branches:
      - develop  # This workflow applies only to PRs targeting develop
    types: [review_requested, submitted]

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Approvals
        id: approvals
        run: |
          # Extract PR number
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          echo "PR Number: $PR_NUMBER"
          
          # Fetch reviews for the PR
          REVIEWS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                     -H "Accept: application/vnd.github.v3+json" \
                     "https://api.github.com/repos/hdfcorg/apirepo/pulls/$PR_NUMBER/reviews")
          
          if [[ -z "$REVIEWS" || "$REVIEWS" == "[]" ]]; then
            echo "❌ No approvals found yet. Merge is blocked until at least one review is submitted."
            exit 1
          fi
          
          # echo "$REVIEWS" > reviews.json
          echo "$REVIEWS" | tee reviews.json
          echo "✅ PR Reviews Fetched Successfully."


      - name: Debug PR Approvals
        run: ls -la && cat reviews.json   # Print reviews for debugging
        

      - name: Validate Approvers from Different Teams
        id: validate_teams
        run: |
          ORGANIZATION="hdfcorg"
          TEAM_A="teamahdfc"
          TEAM_B="teambsidgs"

          TEAM_A_APPROVED=0
          TEAM_B_APPROVED=0

          # Fetch team members for both teams
          TEAM_A_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                                  -H "Accept: application/vnd.github.v3+json" \
                                  "https://api.github.com/orgs/$ORGANIZATION/teams/$TEAM_A/members")
          # TEAM_B_MEMBERS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
             #                     -H "Accept: application/vnd.github.v3+json" \
                           #       "https://api.github.com/orgs/$ORGANIZATION/teams/$TEAM_B/members" | jq -r '.[].login')

          echo "🔹 Team A Members: $TEAM_A_MEMBERS"
          # echo "🔹 Team B Members: $TEAM_B_MEMBERS"



